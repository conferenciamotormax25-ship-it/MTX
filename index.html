<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTX - Controle de Pedidos </title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.7); 
            --text: #f8fafc; 
            --border: rgba(255, 255, 255, 0.1); 
            --success: #10b981; 
            --warning: #f59e0b;
            --accent: #00f2ff; 
            --danger: #fb7185;
            --zoom-level: 1;
        }

        #welcomeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .welcome-content {
            text-align: center;
            animation: superExplode 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes superExplode {
            0% { transform: scale(0.5); opacity: 0; filter: blur(20px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0px); }
        }

        .welcome-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 72px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            background: linear-gradient(90deg, #fff, var(--accent), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            text-transform: uppercase;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .welcome-sub {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 8px;
            font-size: 16px;
            margin-top: 15px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #020617); 
            color: var(--text); 
            padding: 20px; 
            min-height: 100vh; 
            margin: 0; 
            zoom: var(--zoom-level);
            transition: zoom 0.2s ease;
        }

        .container { max-width: 1300px; margin: auto; padding: 20px; }

        #areaPedidos { width: 100%; overflow-x: auto; padding-bottom: 15px; }
        #areaPedidos::-webkit-scrollbar { height: 8px; }
        #areaPedidos::-webkit-scrollbar-track { background: var(--bg); }
        #areaPedidos::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        
        .animar-entrada { animation: fadeInUp 0.4s ease-out forwards; }
        
        .msg-liberdade {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #00f2ff);
            color: #020617;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 11px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            animation: floating 3s ease-in-out infinite;
            border: 1px solid rgba(255,255,255,0.3);
            margin-top: 8px;
            text-transform: uppercase;
        }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { 
            background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); 
            border-radius: 18px; padding: 20px; cursor: pointer; transition: 0.3s;
        }
        .kpi-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        .pedido-row {
            background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--border);
            margin-bottom: 35px; 
            margin-top: 25px;    
            border-radius: 20px; transition: 0.3s;
            display: grid; grid-template-columns: 140px 140px 1fr 140px 150px 120px;
            align-items: center; padding: 30px 20px 20px 20px;
            min-width: 1100px;
            position: relative;
        }

        .num-destaque {
            background: linear-gradient(135deg, #2563eb, #00f2ff);
            color: #020617;
            padding: 6px 15px;
            border-radius: 10px;
            font-weight: 900;
            text-align: center;
            position: absolute;
            top: -18px;
            left: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(0, 242, 255, 0.3);
            border: 2px solid #fff;
            z-index: 10;
            cursor: pointer;
            transition: 0.3s;
        }

        /* AJUSTE PARA NÃO SOBREPOR O URGENTE */
        .pedido-urgente .num-destaque {
            left: 115px;
        }

        .num-destaque:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 242, 255, 0.5);
        }

        .btn-copiado-marcado {
            background: #10b981 !important; 
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5) !important;
        }

        .pedido-antigo { border-left: 5px solid #64748b !important; opacity: 0.8; }

        @keyframes blink-border {
            0% { border-color: var(--border); box-shadow: none; }
            50% { border-color: #ff4d4d; box-shadow: 0 0 15px #ff4d4d; }
            100% { border-color: var(--border); box-shadow: none; }
        }
        .pedido-urgente {
            border: 2px solid #ff4d4d !important;
            animation: blink-border 1.5s infinite !important;
        }

        .zoom-controls { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 10px; z-index: 2000; }
        .btn-zoom {
            background: var(--primary); color: white; border: none; width: 45px; height: 45px;
            border-radius: 50%; font-size: 20px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .btn-zoom:hover { transform: scale(1.1); background: var(--accent); color: #000; }

        .progress-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.8s ease; }
        
        .main-actions { display: flex; gap: 15px; margin-bottom: 25px; align-items: center; }
        .btn-open-modal { background: linear-gradient(135deg, var(--primary), #1e40af); color: white; padding: 16px 30px; border-radius: 16px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 55px; }
        
        .search-container { position: relative; flex-grow: 1; display: flex; align-items: center; }
        .search-input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 16px; padding: 16px 120px 16px 50px; color: white; outline: none; transition: 0.3s; height: 55px; box-sizing: border-box; }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }
        .search-icon { position: absolute; left: 20px; color: #64748b; pointer-events: none; }
        
        .btn-ver-tudo { 
            position: absolute; 
            right: 8px; 
            background: var(--primary); 
            border: none; 
            color: white; 
            border-radius: 10px; 
            padding: 8px 15px; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 800; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .btn-ver-tudo:hover { background: var(--accent); color: #000; transform: translateY(-1px); }

        #modalCadastro { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; border: 1px solid var(--border); border-radius: 30px; width: 95%; max-width: 1000px; padding: 35px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 25px; right: 25px; color: #94a3b8; cursor: pointer; font-size: 30px; }
        .obs-box { background: rgba(0, 242, 255, 0.05); border-left: 3px solid var(--accent); padding: 12px; border-radius: 10px; font-size: 12px; margin-top: 10px; }
        .qty-badge { background: #1e293b; color: var(--accent); padding: 4px 10px; border-radius: 8px; font-weight: 800; border: 1px solid var(--border); }
        .status-badge { padding: 10px 18px; border-radius: 14px; font-size: 11px; font-weight: 800; cursor: pointer; min-width: 110px; display: inline-block; text-align: center; }
        .status-Sim { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
        .status-Não { background: rgba(251, 113, 133, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        
        textarea, input, select { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: white; outline: none; }
        
        .btn-copiar {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            padding: 3px 8px;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-copiar:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .historico-edicao {
            font-size: 9px;
            color: #64748b;
            margin-top: 5px;
            font-style: italic;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 4px;
        }
        
        .swal-history-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0 auto 15px auto;
        }

        .name-chip {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid var(--primary);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .name-chip:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body onload="iniciarBoasVindas()">

<div id="welcomeOverlay">
    <div class="welcome-content">
        <div class="welcome-title">SEJA BEM-VINDO</div>
        <div class="welcome-sub">CONTROLE DE PEDIDOS MTX</div>
    </div>
</div>

<div class="zoom-controls">
    <button class="btn-zoom" onclick="window.ajustarZoom(0.1)" title="Aumentar Zoom">＋</button>
    <button class="btn-zoom" onclick="window.ajustarZoom(-0.1)" title="Diminuir Zoom">－</button>
</div>

<div class="container">
    <div class="kpi-label" style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
        <span id="txtStatusLanca" style="font-weight: 800; letter-spacing: 0.5px; font-family: 'Montserrat', sans-serif;">🚀 STATUS DO DIA</span>
        <span id="percProgresso" style="background: var(--accent); color: #0f172a; padding: 2px 8px; border-radius: 6px; font-weight: 900; font-size: 12px;">0%</span>
    </div>
    <div class="progress-container"><div id="mainProgressBar" class="progress-bar"></div></div>

    <div class="dashboard-grid">
        <div class="kpi-card" onclick="window.filtrarHoje()"><span class="kpi-label">📅 Hoje</span><span class="kpi-value" id="countHoje">0</span></div>
        <div class="kpi-card" onclick="window.limparFiltro()"><span class="kpi-label">📦 Total</span><span class="kpi-value" id="totalPedidosCount">0</span></div>
        <div class="kpi-card" onclick="window.filtrarPorStatus('Não')"><span class="kpi-label">⏳ Pendentes</span><span class="kpi-value" id="countPendentes" style="color: var(--danger);">0</span></div>
        <div class="kpi-card" style="border-color: var(--accent); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <span class="kpi-label">🕒 Horário</span>
            <span class="kpi-value" id="relogioDinamico" style="font-size: 24px; font-family: 'Montserrat', sans-serif; letter-spacing: 1px;">00:00:00</span>
            <div id="contagemLiberdade" class="msg-liberdade">...</div>
            <div id="dataDinamica" style="font-size: 10px; color: #94a3b8; margin-top: 8px; font-weight: 600;">---</div>
        </div>
    </div>

    <div class="main-actions">
        <button class="btn-open-modal" onclick="window.abrirNovoPedido()"><span>➕</span> NOVO PEDIDO</button>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="inputBusca" class="search-input" placeholder="Buscar pedido, produto ou solicitante..." onkeyup="window.filtrarPedidos()">
            <button class="btn-ver-tudo" onclick="window.limparFiltro()">Ver Tudo</button>
        </div>
    </div>

    <div id="modalCadastro">
        <div class="modal-content animar-entrada">
            <span class="close-modal" onclick="window.toggleModal(false)">&times;</span>
            <h2 id="modalTitle" style="margin:0 0 25px 0; color:var(--accent); font-family: 'Montserrat', sans-serif;">Registrar Pedido</h2>
            <input type="hidden" id="editId">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <input type="text" id="numPedido" placeholder="Número Pedido">
                <input type="date" id="dataPedido">
                <select id="situacao"><option value="Não">⏳ PENDENTE</option><option value="Sim">✅ LANÇADO</option></select>
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 15px; align-items: center;">
                <div style="flex-grow: 1; position: relative; display: flex; gap: 10px;">
                    <input type="text" id="solicitante" list="listaSolicitantes" placeholder="Quem fez o pedido? (Nome)" style="flex-grow: 1; text-transform: uppercase;">
                    <button onclick="window.abrirHistoricoNomes()" style="background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 12px; cursor: pointer; font-size: 18px;" title="Selecionar do histórico">🕒</button>
                    <datalist id="listaSolicitantes"></datalist>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; background: rgba(251, 113, 133, 0.1); padding: 10px; border-radius: 12px; border: 1px solid var(--danger);">
                    <input type="checkbox" id="checkUrgente" style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="checkUrgente" style="color: var(--danger); font-weight: 800; font-size: 12px; cursor: pointer;">🚨 URGENTE</label>
                </div>
            </div>

            <textarea id="obsPedido" placeholder="Observações..." style="width: 100%; height: 80px; margin-top: 5px; border-left: 4px solid var(--accent); resize: none; box-sizing: border-box;"></textarea>
            <div style="display: grid; grid-template-columns: 2fr 0.8fr 1.2fr 1fr; gap: 15px; margin-top: 25px;">
                <input type="text" id="nomeProd" placeholder="Produto">
                <input type="number" id="qtdProd" value="1">
                <input type="number" id="precoProd" step="0.01" placeholder="Preço" onkeydown="if(event.key==='Enter') window.adicionarItem()">
                <button class="btn-open-modal" onclick="window.adicionarItem()" style="background: var(--success); justify-content: center;">INSERIR</button>
            </div>
            <div style="margin-top: 25px; border-radius: 15px; overflow: hidden; border: 1px solid var(--border);">
                <table style="width:100%; border-collapse: collapse; background: rgba(15, 23, 42, 0.4);">
                    <tbody id="displayItens"></tbody>
                </table>
            </div>
            <div style="margin-top: 25px; padding: 25px; background: rgba(15, 23, 42, 0.6); border-radius: 20px; display: flex; justify-content: space-between; align-items: center;">
                <span class="kpi-label">TOTAL</span>
                <strong style="font-size: 32px; font-family: 'Montserrat', sans-serif;">R$ <span id="totalFinal">0,00</span></strong>
            </div>
            <button class="btn-open-modal" style="width:100%; justify-content: center; margin-top:20px; height:65px;" onclick="window.salvarNaNuvem()">💾 SALVAR NA NUVEM</button>
        </div>
    </div>

    <div id="areaPedidos">
        <div id="tabelaCorpo" class="animar-entrada"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB0_kv4kQfcTdT7D5_Imf5NrG4EvY1p0lQ",
        authDomain: "base-de-dados-pedidos-mtx.firebaseapp.com",
        projectId: "base-de-dados-pedidos-mtx",
        storageBucket: "base-de-dados-pedidos-mtx.firebasestorage.app",
        messagingSenderId: "702134531011",
        appId: "1:702134531011:web:debe80ae3577602aec8376"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const pedidosRef = collection(db, "pedidos_mtx");
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1200, background: '#1e293b', color: '#fff' });

    let itensAtuais = [];
    let zoomLevel = 1.0;
    let historicoEdicaoOriginal = [];

    const formatBRL = (valor) => {
        const n = typeof valor === 'string' ? parseFloat(valor.replace(',','.')) : valor;
        return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    window.copiarValorSistema = (valorFormatado, btn) => {
        const valorParaSistema = valorFormatado.replace(/\./g, '').replace(',', '.');
        window.copiarTexto(valorParaSistema, btn);
    };

    window.iniciarBoasVindas = () => {
        setTimeout(() => {
            const overlay = document.getElementById('welcomeOverlay');
            if(overlay) {
                overlay.style.opacity = '0';
                overlay.style.transform = 'scale(1.2)';
                setTimeout(() => { overlay.style.visibility = 'hidden'; }, 1000);
            }
        }, 2000);
        verificarDiaPagamentoConfete();
    };

    function verificarDiaPagamentoConfete() {
        const agora = new Date();
        const dia = agora.getDate();
        const getQuintoDiaUtil = (date) => {
            let count = 0; let d = new Date(date.getFullYear(), date.getMonth(), 1);
            while (count < 5) { let dayOfWeek = d.getDay(); if (dayOfWeek !== 0 && dayOfWeek !== 6) count++; if (count < 5) d.setDate(d.getDate() + 1); }
            return d.getDate();
        };
        if (dia === 20 || dia === getQuintoDiaUtil(agora)) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff0000', '#00f2ff', '#ffffff'] });
        }
    }

    window.copiarTexto = (texto, btn) => {
        navigator.clipboard.writeText(texto).then(() => {
            btn.classList.add('btn-copiado-marcado');
            const oldText = btn.innerText;
            if(!oldText.includes("x") && !oldText.includes("#")) {
                btn.innerText = "COPIADO";
                setTimeout(() => { 
                    btn.innerText = "OK!"; 
                }, 1000);
            }
            Toast.fire({ icon: 'success', title: 'Copiado!' });
        });
    };

    function atualizarRelogio() {
        const agora = new Date();
        const relogio = document.getElementById('relogioDinamico');
        const dataDinamica = document.getElementById('dataDinamica');
        const divLib = document.getElementById('contagemLiberdade');
        const labelStatus = document.getElementById('txtStatusLanca');

        if(relogio) relogio.innerText = agora.toLocaleTimeString('pt-BR');
        
        let msgEspecial = "";
        const diaAtual = agora.getDate();
        const getQuintoDiaUtil = (date) => {
            let count = 0; let d = new Date(date.getFullYear(), date.getMonth(), 1);
            while (count < 5) { let dayOfWeek = d.getDay(); if (dayOfWeek !== 0 && dayOfWeek !== 6) count++; if (count < 5) d.setDate(d.getDate() + 1); }
            return d.getDate();
        };
        const quintoDiaUtil = getQuintoDiaUtil(agora);

        if (diaAtual === 20) msgEspecial = " 🔥 <span style='color:#ff4d4d; text-shadow: 0 0 10px #ff0000; font-weight:800;'>HJ É DIA DO ADIANTAMENTO TE MOTIVA!</span>";
        else if (diaAtual === quintoDiaUtil) msgEspecial = " 💰 <span style='color:#ff4d4d; text-shadow: 0 0 10px #ff0000; font-weight:800;'>HJ É DIA DO SALÁRIO, FAZ O TEU MELHOR AII!</span>";

        if(dataDinamica) {
            const dataTexto = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }).toUpperCase();
            dataDinamica.innerHTML = dataTexto + (msgEspecial ? `<br>${msgEspecial}` : "");
        }

        const hora = agora.getHours();
        if(labelStatus && !labelStatus.innerText.includes("TUDO LANÇADO")) {
            let humor = "🚀 STATUS DO DIA";
            if(hora < 10) humor = "☕ MAIS UM DIA DE VIDA, FOCO NO TRABALHO !!";
            else if(hora >= 11 && humor < 13) humor = "🍕 QUASE HORA DA PARA TECNICA! FOME BATEU?";
            else if(hora >= 14 && hora < 16) humor = "⚡ ENERGIA RENOVADA, BORA TRABALHAR!";
            else if(hora >= 17) humor = "🏁 RETA FINAL! QUASE NA HORA!";
            
            const pendentes = document.getElementById('countPendentes').innerText;
            labelStatus.innerText = `${humor} (PEDIDOS A SER LANÇADOS ➡➡ ${pendentes})`;
        }

        if(divLib) {
            const fim = new Date();
            fim.setHours(18, 0, 0, 0);
            if (agora < fim && agora.getHours() >= 8) {
                const diff = fim - agora;
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                divLib.innerHTML = `🚀 ${h}h ${m}m ${s}s PARA O FINAL DO EXPEDIENTE! ✨`;
                divLib.style.background = "linear-gradient(90deg, #2563eb, #00f2ff)";
                divLib.style.color = "#000";
            } else if (agora.getHours() >= 18) {
                divLib.innerHTML = `🥳 HORA DE IR PRA CASA!`;
                divLib.style.background = "var(--success)";
                divLib.style.color = "#fff";
            } else {
                divLib.innerHTML = `🌅 BOM DIA DE TRABALHO!`;
                divLib.style.background = "#64748b";
            }
        }
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    window.abrirHistoricoNomes = async () => {
        const nomes = JSON.parse(localStorage.getItem('mtx_nomes') || "[]");
        if(nomes.length === 0) return Toast.fire({ icon: 'info', title: 'Nenhum nome no histórico!' });
        
        const botoesHTML = nomes.map(n => 
            `<button onclick="Swal.clickConfirm(); window.selecionarNomeRapido('${n}')" class="name-chip">👤 ${n}</button>`
        ).join('');

        await Swal.fire({ 
            title: 'SELECIONAR OPERADOR', 
            html: `<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px;">${botoesHTML}</div>`,
            showConfirmButton: false, 
            showCancelButton: true, 
            cancelButtonText: 'FECHAR',
            background: '#1e293b', 
            color: '#fff' 
        });
    };

    window.selecionarNomeRapido = (nome) => {
        const solicitanteInput = document.getElementById('solicitante');
        if(solicitanteInput) solicitanteInput.value = nome.toUpperCase();
        const swalInput = document.querySelector('.swal2-input');
        if(swalInput) swalInput.value = nome.toUpperCase();
    };

    window.ajustarZoom = (delta) => { zoomLevel += delta; zoomLevel = Math.max(0.5, Math.min(1.5, zoomLevel)); document.body.style.zoom = zoomLevel; };
    window.toggleModal = (show) => { 
        document.getElementById('modalCadastro').style.display = show ? 'flex' : 'none'; 
        if(!show) window.limparFormulario();
        if(show) {
            const nomes = JSON.parse(localStorage.getItem('mtx_nomes') || "[]");
            document.getElementById('listaSolicitantes').innerHTML = nomes.map(n => `<option value="${n}">`).join('');
        }
    };
    window.limparFormulario = () => {
        document.getElementById('editId').value = ''; document.getElementById('numPedido').value = '';
        document.getElementById('obsPedido').value = ''; document.getElementById('nomeProd').value = '';
        document.getElementById('solicitante').value = ''; document.getElementById('checkUrgente').checked = false;
        document.getElementById('precoProd').value = ''; document.getElementById('displayItens').innerHTML = '';
        document.getElementById('totalFinal').innerText = '0,00'; itensAtuais = [];
        historicoEdicaoOriginal = [];
    };
    window.abrirNovoPedido = () => { window.toggleModal(true); document.getElementById('dataPedido').value = new Date().toISOString().split('T')[0]; };
    
    window.adicionarItem = () => {
        const n = document.getElementById('nomeProd'), q = document.getElementById('qtdProd'), p = document.getElementById('precoProd');
        if(!n.value || !p.value) return;
        itensAtuais.push({ nome: n.value.toUpperCase(), qtd: parseFloat(q.value), preco: parseFloat(p.value), subtotal: q.value * p.value });
        n.value = ''; p.value = ''; q.value = '1'; n.focus();
        renderizarItens();
    };

    const renderizarItens = () => {
        const d = document.getElementById('displayItens');
        d.innerHTML = ''; let t = 0;
        itensAtuais.forEach((i, idx) => {
            t += i.subtotal;
            d.innerHTML += `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:12px;"><span class="qty-badge">${i.qtd}x</span></td><td style="color:white; font-weight:600;">${i.nome}</td><td style="text-align:right;">R$ ${formatBRL(i.preco)}</td><td style="text-align:right; font-weight:700; color:var(--accent); padding-right:12px;">R$ ${formatBRL(i.subtotal)}</td><td style="text-align:center; display:flex; gap:10px; justify-content:center; padding: 12px 0;"><button onclick="window.corrigirItem(${idx})" style="background:none; color:var(--warning); border:none; cursor:pointer; font-size:16px;">✏️</button><button onclick="window.removerItem(${idx})" style="background:none; color:var(--danger); border:none; cursor:pointer; font-size:20px;">&times;</button></td></tr>`;
        });
        document.getElementById('totalFinal').innerText = formatBRL(t);
    };

    window.corrigirItem = (idx) => {
        const item = itensAtuais[idx]; document.getElementById('nomeProd').value = item.nome; document.getElementById('qtdProd').value = item.qtd; document.getElementById('precoProd').value = item.preco;
        itensAtuais.splice(idx, 1); renderizarItens(); document.getElementById('nomeProd').focus();
        Toast.fire({ icon: 'info', title: 'Corrija e insira novamente!' });
    };

    window.removerItem = (i) => { itensAtuais.splice(i, 1); renderizarItens(); };

    window.salvarNaNuvem = async () => {
        const id = document.getElementById('editId').value;
        const numPed = document.getElementById('numPedido').value;
        if(!numPed || itensAtuais.length === 0) return Toast.fire({ icon: 'error', title: 'Adicione produtos!' });

        const { value: nomeOperador } = await Swal.fire({
            title: 'IDENTIFIQUE-SE',
            html: `<div style="margin-top:20px">Nome para o registro de ${id ? 'ALTERAÇÃO' : 'LANÇAMENTO'}</div>`,
            input: 'text', inputValue: document.getElementById('solicitante').value.toUpperCase(),
            showCancelButton: true, confirmButtonText: 'SALVAR 🚀', background: '#1e293b', color: '#fff', confirmButtonColor: '#2563eb',
            inputAttributes: { style: 'text-transform: uppercase;' }, inputValidator: (v) => !v && 'Digite seu nome!'
        });

        if (!nomeOperador) return;

        const agora = new Date();
        const nomeFinal = nomeOperador.toUpperCase().trim();
        const infoLog = { quem: nomeFinal, quando: `${agora.toLocaleDateString('pt-BR')} às ${agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`, tipo: id ? 'edicao' : 'criacao' };

        const payload = { 
            num: numPed, data: document.getElementById('dataPedido').value, hora: agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
            situacao: document.getElementById('situacao').value, solicitante: nomeFinal,
            obs: document.getElementById('obsPedido').value || "S/O", itens_detalhados: itensAtuais, 
            total: document.getElementById('totalFinal').innerText, timestamp: Date.now(),
            urgente: document.getElementById('checkUrgente').checked 
        };

        try {
            let histLocal = JSON.parse(localStorage.getItem('mtx_nomes') || "[]");
            if(!histLocal.includes(nomeFinal)) { histLocal.push(nomeFinal); localStorage.setItem('mtx_nomes', JSON.stringify(histLocal)); }

            if(id) {
                payload.historico_logs = [...historicoEdicaoOriginal, infoLog];
                await updateDoc(doc(db, "pedidos_mtx", id), payload);
                Toast.fire({ icon: 'success', title: 'Sincronizado!' });
            } else {
                payload.historico_logs = [infoLog];
                await addDoc(pedidosRef, payload);
                Swal.fire({ title: '🚀 PEDIDO CONCLUÍDO!', html: `<div style=\"font-size: 1.2rem; margin-bottom: 15px;\">Pedido registrado com sucesso!</div><div style=\"background: #fb7185; color: #fff; padding: 15px; border-radius: 10px; font-weight: 800; border: 2px solid #fff;\">⚠️ NÃO ESQUEÇA DE AVISAR O MARCOS <br> PARA DAR ENTRADA NESSE PEDIDO!</div>`, icon: 'success', background: '#0f172a', color: '#fff', confirmButtonText: 'VOU AVISAR!', confirmButtonColor: '#2563eb' });
            }
            window.toggleModal(false);
        } catch (e) { Toast.fire({ icon: 'error', title: 'Erro de Banco' }); }
    };

    onSnapshot(pedidosRef, (snap) => {
        const corpo = document.getElementById('tabelaCorpo'); corpo.innerHTML = '';
        let conc = 0, hj = 0, lista = [];
        const hojeISO = new Date().toISOString().split('T')[0];
        snap.forEach(d => {
            const data = d.data(); lista.push({id: d.id, ...data});
            if(data.situacao === 'Sim') conc++;
            if(data.data === hojeISO) hj++;
        });

        const total = snap.size;
        const pendentes = total - conc;
        document.getElementById('totalPedidosCount').innerText = total;
        document.getElementById('countPendentes').innerText = pendentes;
        document.getElementById('countHoje').innerText = hj;

        const perc = total > 0 ? Math.round((conc / total) * 100) : 0;
        document.getElementById('mainProgressBar').style.width = perc + '%';
        document.getElementById('percProgresso').innerText = perc + '%';

        lista.sort((a,b) => b.timestamp - a.timestamp).forEach(p => {
            const row = document.createElement('div'); 
            row.className = 'pedido-row animar-entrada';
            if(p.data !== hojeISO) { row.classList.add('pedido-antigo'); row.style.display = 'none'; }
            if(p.urgente) row.classList.add('pedido-urgente');

            const prodHTML = p.itens_detalhados.map(i => {
                const precoFormatado = formatBRL(i.preco);
                return `<div style=\"display:flex; flex-direction:column; margin-bottom:10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;\">
                    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap: wrap;\">
                        <button class=\"btn-copiar\" onclick=\"window.copiarTexto('${i.qtd}', this)\" style=\"background: #1e293b; color: var(--accent); padding: 4px 10px; border-radius: 8px; font-weight: 800; border: 1px solid var(--border); min-width: 45px;\">${i.qtd}x</button>
                        <span style=\"font-size:14px; font-weight:700; color:white;\">${i.nome}</span>
                        <button class=\"btn-copiar\" onclick=\"window.copiarTexto('${i.nome}', this)\">COPIAR</button>
                    </div>
                    <div style=\"display:flex; align-items:center; gap:8px; margin-top:4px; font-size:11px; color:#94a3b8;\">
                        <span>Un: R$ ${precoFormatado}</span>
                        <button class=\"btn-copiar\" onclick=\"window.copiarValorSistema('${precoFormatado}', this)\" style=\"padding: 1px 5px; font-size: 8px;\">COPIAR </button>
                    </div>
                </div>`;
            }).join('');

            let htmlLog = "";
            if(p.historico_logs && p.historico_logs.length > 0) {
                const primeiro = p.historico_logs[0]; const ultimo = p.historico_logs[p.historico_logs.length - 1];
                htmlLog += `<div class=\"historico-edicao\">🚀 Criado por: ${primeiro.quem} em ${primeiro.quando}</div>`;
                if(p.historico_logs.length > 1) {
                    const isStatus = ultimo.tipo === 'status'; const icone = isStatus ? '✅' : '📝';
                    htmlLog += `<div class=\"historico-edicao\" style=\"color:${isStatus ? 'var(--success)' : 'var(--warning)'}; border:none; padding-top:0;\">${icone} por: ${ultimo.quem} em ${ultimo.quando}</div>`;
                }
            }

            row.innerHTML = `
                <div>
                    <div class="num-destaque" onclick="window.copiarTexto('${p.num}', this)">#${p.num}</div>
                    
                    <div style="font-size: 10px; color: var(--accent); margin-top: 15px; text-align: center; font-weight: 800; background: rgba(0, 242, 255, 0.1); padding: 5px; border-radius: 8px; border: 1px solid rgba(0, 242, 255, 0.2); text-transform: uppercase;">
                        👤 ${p.solicitante || 'S/N'}
                    </div>
                </div>
                <div style="color:#94a3b8; font-size:13px; font-weight:700; padding-left:15px; display: flex; flex-direction: column;">
                    <span>📅 ${p.data.split('-').reverse().join('/')}</span>
                    <span style="font-size: 11px; color: var(--accent); opacity: 0.8;">🕒 ${p.hora || '--:--'}</span>
                    ${htmlLog}
                </div>
                <div style="padding:0 25px;">${prodHTML}${p.obs !== "S/O" ? `<div class=\"obs-box\"><b>OBS:</b> ${p.obs}</div>` : ''}</div>
                <div style="text-align:right; font-weight:900; font-size:20px;">R$ ${p.total}</div>
                <div style="text-align:center;">
                    <span class=\"status-badge status-${p.situacao}\" onclick=\"window.mudarStatus('${p.id}', '${p.situacao}')\">${p.situacao === 'Sim' ? '✅ LANÇADO' : '⏳ PENDENTE'}</span>
                </div>
                <div style="text-align:right; display:flex; flex-direction:column; gap:10px;">
                    <button onclick=\"window.editarPedido('${p.id}')\" style=\"background:none; color:var(--warning); border:none; cursor:pointer; font-weight:900; font-size:11px;\">EDITAR</button>
                    <button onclick=\"window.excluirPedido('${p.id}')\" style=\"background:none; color:#64748b; border:none; cursor:pointer; font-size:11px;\">EXCLUIR</button>
                </div>`;
                
            if(p.urgente) {
                const badge = document.createElement('div');
                badge.style = "position:absolute; top:-12px; left:15px; background:var(--danger); color:white; padding:4px 10px; border-radius:8px; font-size:10px; font-weight:900; border:2px solid #fff; z-index:11;";
                badge.innerText = "🚨 URGENTE";
                row.appendChild(badge);
            }
            corpo.appendChild(row);
        });
    });

    window.mudarStatus = async (id, s) => { 
        const statusNovo = s === "Sim" ? "Não" : "Sim";
        const { value: nomeStatus } = await Swal.fire({ 
            title: 'ALTERAR STATUS', 
            html: `<button onclick=\"window.abrirHistoricoNomes()\" class=\"swal-history-btn\">🕒 HISTÓRICO</button><div style=\"margin-top:20px\">Confirmar alteração para ${statusNovo === 'Sim' ? 'LANÇADO' : 'PENDENTE'}?</div>`, 
            input: 'text', 
            inputPlaceholder: 'Quem está alterando?', 
            showCancelButton: true, 
            confirmButtonText: 'ATUALIZAR ✅', 
            background: '#1e293b', 
            color: '#fff', 
            confirmButtonColor: '#10b981', 
            inputValidator: (v) => !v && 'Identifique-se!' 
        });
        if (!nomeStatus) return;
        const snap = await getDoc(doc(db, "pedidos_mtx", id));
        if(snap.exists()){
            const d = snap.data(); const agora = new Date();
            const logStatus = { quem: nomeStatus.toUpperCase(), quando: `${agora.toLocaleDateString('pt-BR')} às ${agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`, tipo: 'status' };
            await updateDoc(doc(db, "pedidos_mtx", id), { situacao: statusNovo, historico_logs: [...(d.historico_logs || []), logStatus] }); 
            Toast.fire({ icon: 'success', title: 'Status Atualizado!' });
        }
    };

    window.limparFiltro = () => { 
        document.querySelectorAll('.pedido-row').forEach(r => r.style.display = ''); 
        document.getElementById('inputBusca').value = ''; 
    };

    window.filtrarHoje = () => { const hjBR = new Date().toLocaleDateString('pt-BR'); document.querySelectorAll('.pedido-row').forEach(r => r.style.display = r.innerText.includes(hjBR) ? '' : 'none'); };
    window.filtrarPorStatus = (s) => { const texto = s === 'Sim' ? 'LANÇADO' : 'PENDENTE'; document.querySelectorAll('.pedido-row').forEach(r => r.style.display = r.innerText.includes(texto) ? '' : 'none'); };
    
    window.filtrarPedidos = () => {
        const t = document.getElementById('inputBusca').value.toLowerCase();
        const linhas = document.querySelectorAll('.pedido-row'); const hojeBR = new Date().toLocaleDateString('pt-BR');
        linhas.forEach(r => { const textoLinha = r.innerText.toLowerCase(); if (t === "") { r.style.display = textoLinha.includes(hojeBR) ? '' : 'none'; } else { r.style.display = textoLinha.includes(t) ? '' : 'none'; } });
    };

    window.editarPedido = async (id) => {
        const snap = await getDoc(doc(db, "pedidos_mtx", id));
        if(snap.exists()) {
            const d = snap.data(); document.getElementById('editId').value = id; document.getElementById('numPedido').value = d.num; document.getElementById('dataPedido').value = d.data; document.getElementById('situacao').value = d.situacao; document.getElementById('obsPedido').value = d.obs; document.getElementById('solicitante').value = d.solicitante || '';
            document.getElementById('checkUrgente').checked = d.urgente || false;
            itensAtuais = d.itens_detalhados; historicoEdicaoOriginal = d.historico_logs || []; renderizarItens(); window.toggleModal(true);
        }
    };

    window.excluirPedido = async (id) => {
        const r = await Swal.fire({ title: 'Excluir?', text: "Apagar!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#fb7185', background: '#1e293b', color: '#fff' });
        if (r.isConfirmed) { await deleteDoc(doc(db, "pedidos_mtx", id)); Toast.fire({ icon: 'success', title: 'Excluído!' }); }
    };
</script>
</body>
</html>
